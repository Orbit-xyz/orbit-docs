name: Docs checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck generated docs and TypeScript
        run: npm run types:check
      - name: Build documentation site
        run: npm run build
